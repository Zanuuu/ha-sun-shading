# Tests du composant Home Assistant (pytest-homeassistant-custom-component).
# Les autres vérifications du dépôt ne passent pas par pytest : les tests de
# la page sont des specs Playwright (npm test) et tests/test_masque.py est un
# script autonome, à dessein — il ne doit dépendre que de la bibliothèque
# standard pour rester exécutable partout.
[pytest]
asyncio_mode = auto
testpaths = tests/composant
